name: Unpack subtitle payload

on:
  push:
    paths:
      - 'payload/complete'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct subtitles
        shell: bash
        run: |
          cat payload/part-* > /tmp/subtitles.tar.gz.b64
          base64 -d /tmp/subtitles.tar.gz.b64 > /tmp/subtitles.tar.gz
          tar -xzf /tmp/subtitles.tar.gz
          test -f subtitles/左眼侦探EYE_EP01.zh-CN.ass
          test -f subtitles/左眼侦探EYE_EP08.zh-CN.ass
          test -f subtitles/左眼侦探EYE_SP.zh-CN.ass
      - name: Commit subtitle files and remove payload
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf payload
          git add -A subtitles payload
          git commit -m 'Add EP01-08 and SP Chinese subtitles'
          git push
